# Contrat OpenAPI 3.1 de l'API Orbitale (TP S2)
openapi: 3.1.0
info:
  title: API Orbitale
  version: 1.0.0
  summary: Billetterie d'événements
  description: |
    API REST de la plateforme Orbitale.
    Les erreurs suivent la RFC 9457 (application/problem+json).
  contact:
    name: Équipe API Orbitale
    email: api@orbitale.test
servers:
  - url: http://localhost:3000
    description: Développement local
tags:
  - name: Événements
    description: Catalogue et gestion des événements
  - name: Commandes
    description: Création et suivi des commandes de billets
  - name: Billets
    description: Consultation des billets émis
  - name: Scans
    description: Validation des billets par les bornes d'entrée

paths:
  /v1/events:
    get:
      tags: [Événements]
      operationId: listEvents
      summary: Lister les événements
      parameters:
        - name: status
          in: query
          required: false
          description: Filtrer par statut d'événement
          schema:
            type: string
            enum: [draft, published, cancelled]
      responses:
        '200':
          description: Liste des événements
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Event' }
              example:
                data:
                  - id: 6f1c2b8e-4f3a-4e8b-9a51-2d7c0f9e1a23
                    title: Nuit électro
                    description: null
                    venue: Le Zénith, Paris
                    startsAt: '2027-03-19T20:00:00.000Z'
                    capacity: 6000
                    remaining: 5874
                    price: 3900
                    currency: EUR
                    status: published
                    createdAt: '2026-11-20T10:00:00.000Z'
                    updatedAt: '2026-11-20T10:00:00.000Z'
        '422': { $ref: '#/components/responses/Validation' }

    post:
      tags: [Événements]
      operationId: createEvent
      summary: Créer un événement
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EventCreate' }
            example:
              title: Nuit électro
              description: Soirée musiques électroniques au Zénith
              venue: Le Zénith, Paris
              startsAt: '2027-03-19T20:00:00.000Z'
              capacity: 6000
              price: 3900
              status: published
      responses:
        '201':
          description: Événement créé
          headers:
            Location: { $ref: '#/components/headers/Location' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Event' }
              example:
                id: 6f1c2b8e-4f3a-4e8b-9a51-2d7c0f9e1a23
                title: Nuit électro
                description: Soirée musiques électroniques au Zénith
                venue: Le Zénith, Paris
                startsAt: '2027-03-19T20:00:00.000Z'
                capacity: 6000
                remaining: 6000
                price: 3900
                currency: EUR
                status: published
                createdAt: '2026-11-20T10:00:00.000Z'
                updatedAt: '2026-11-20T10:00:00.000Z'
        '400': { $ref: '#/components/responses/BadRequest' }
        '422': { $ref: '#/components/responses/Validation' }

  /v1/events/{eventId}:
    parameters:
      - $ref: '#/components/parameters/EventId'
    get:
      tags: [Événements]
      operationId: getEvent
      summary: Lire un événement
      responses:
        '200':
          description: L'événement demandé
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Event' }
              example:
                id: 6f1c2b8e-4f3a-4e8b-9a51-2d7c0f9e1a23
                title: Nuit électro
                description: null
                venue: Le Zénith, Paris
                startsAt: '2027-03-19T20:00:00.000Z'
                capacity: 6000
                remaining: 5874
                price: 3900
                currency: EUR
                status: published
                createdAt: '2026-11-20T10:00:00.000Z'
                updatedAt: '2026-11-20T10:00:00.000Z'
        '404': { $ref: '#/components/responses/NotFound' }

    patch:
      tags: [Événements]
      operationId: updateEvent
      summary: Modifier partiellement un événement
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EventPatch' }
            example:
              price: 4200
              status: published
      responses:
        '200':
          description: Événement mis à jour
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Event' }
              example:
                id: 6f1c2b8e-4f3a-4e8b-9a51-2d7c0f9e1a23
                title: Nuit électro
                description: null
                venue: Le Zénith, Paris
                startsAt: '2027-03-19T20:00:00.000Z'
                capacity: 6000
                remaining: 5874
                price: 4200
                currency: EUR
                status: published
                createdAt: '2026-11-20T10:00:00.000Z'
                updatedAt: '2026-11-20T14:30:00.000Z'
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Validation' }

    delete:
      tags: [Événements]
      operationId: deleteEvent
      summary: Supprimer un événement
      responses:
        '204':
          description: Événement supprimé
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /v1/orders:
    post:
      tags: [Commandes]
      operationId: createOrder
      summary: Créer une commande de billets
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrderCreate' }
            example:
              eventId: 6f1c2b8e-4f3a-4e8b-9a51-2d7c0f9e1a23
              quantity: 2
              buyerEmail: alice.martin@example.com
      responses:
        '201':
          description: Commande créée
          headers:
            Location: { $ref: '#/components/headers/Location' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
              example:
                id: 9b2d4e6f-1a2b-4c3d-8e5f-1234567890ab
                eventId: 6f1c2b8e-4f3a-4e8b-9a51-2d7c0f9e1a23
                buyerEmail: alice.martin@example.com
                totalAmount: 7800
                currency: EUR
                status: confirmed
                tickets:
                  - id: 11111111-2222-4333-8444-555555555555
                    orderId: 9b2d4e6f-1a2b-4c3d-8e5f-1234567890ab
                    eventId: 6f1c2b8e-4f3a-4e8b-9a51-2d7c0f9e1a23
                    code: ORB-A1B2C3D4E5F6
                    status: valid
                    usedAt: null
                  - id: 22222222-3333-4444-8555-666666666666
                    orderId: 9b2d4e6f-1a2b-4c3d-8e5f-1234567890ab
                    eventId: 6f1c2b8e-4f3a-4e8b-9a51-2d7c0f9e1a23
                    code: ORB-123456ABCDEF
                    status: valid
                    usedAt: null
                createdAt: '2026-11-20T15:00:00.000Z'
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Validation' }

  /v1/orders/{orderId}:
    parameters:
      - $ref: '#/components/parameters/OrderId'
    get:
      tags: [Commandes]
      operationId: getOrder
      summary: Lire une commande
      responses:
        '200':
          description: La commande demandée
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
              example:
                id: 9b2d4e6f-1a2b-4c3d-8e5f-1234567890ab
                eventId: 6f1c2b8e-4f3a-4e8b-9a51-2d7c0f9e1a23
                buyerEmail: alice.martin@example.com
                totalAmount: 7800
                currency: EUR
                status: confirmed
                tickets:
                  - id: 11111111-2222-4333-8444-555555555555
                    orderId: 9b2d4e6f-1a2b-4c3d-8e5f-1234567890ab
                    eventId: 6f1c2b8e-4f3a-4e8b-9a51-2d7c0f9e1a23
                    code: ORB-A1B2C3D4E5F6
                    status: valid
                    usedAt: null
                createdAt: '2026-11-20T15:00:00.000Z'
        '404': { $ref: '#/components/responses/NotFound' }

    patch:
      tags: [Commandes]
      operationId: updateOrder
      summary: Modifier le statut d'une commande (ex. annulation)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrderPatch' }
            example:
              status: cancelled
      responses:
        '200':
          description: Commande mise à jour
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
              example:
                id: 9b2d4e6f-1a2b-4c3d-8e5f-1234567890ab
                eventId: 6f1c2b8e-4f3a-4e8b-9a51-2d7c0f9e1a23
                buyerEmail: alice.martin@example.com
                totalAmount: 7800
                currency: EUR
                status: cancelled
                tickets:
                  - id: 11111111-2222-4333-8444-555555555555
                    orderId: 9b2d4e6f-1a2b-4c3d-8e5f-1234567890ab
                    eventId: 6f1c2b8e-4f3a-4e8b-9a51-2d7c0f9e1a23
                    code: ORB-A1B2C3D4E5F6
                    status: cancelled
                    usedAt: null
                createdAt: '2026-11-20T15:00:00.000Z'
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Validation' }

  /v1/orders/{orderId}/tickets:
    parameters:
      - $ref: '#/components/parameters/OrderId'
    get:
      tags: [Commandes]
      operationId: listOrderTickets
      summary: Lister les billets d'une commande
      responses:
        '200':
          description: Liste des billets de la commande
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Ticket' }
              example:
                data:
                  - id: 11111111-2222-4333-8444-555555555555
                    orderId: 9b2d4e6f-1a2b-4c3d-8e5f-1234567890ab
                    eventId: 6f1c2b8e-4f3a-4e8b-9a51-2d7c0f9e1a23
                    code: ORB-A1B2C3D4E5F6
                    status: valid
                    usedAt: null
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/tickets/{ticketId}:
    parameters:
      - $ref: '#/components/parameters/TicketId'
    get:
      tags: [Billets]
      operationId: getTicket
      summary: Lire un billet
      responses:
        '200':
          description: Le billet demandé
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ticket' }
              example:
                id: 11111111-2222-4333-8444-555555555555
                orderId: 9b2d4e6f-1a2b-4c3d-8e5f-1234567890ab
                eventId: 6f1c2b8e-4f3a-4e8b-9a51-2d7c0f9e1a23
                code: ORB-A1B2C3D4E5F6
                status: valid
                usedAt: null
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/scans:
    post:
      tags: [Scans]
      operationId: createScan
      summary: Valider un billet à l'entrée (créer un scan)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ScanCreate' }
            example:
              ticketCode: ORB-A1B2C3D4E5F6
              gate: Porte Nord
      responses:
        '201':
          description: Billet scanné et validé
          headers:
            Location: { $ref: '#/components/headers/Location' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Scan' }
              example:
                id: 77777777-8888-4999-8aaa-bbbbbbbbbbbb
                ticketId: 11111111-2222-4333-8444-555555555555
                ticketCode: ORB-A1B2C3D4E5F6
                gate: Porte Nord
                result: valid
                scannedAt: '2027-03-19T19:45:12.000Z'
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Validation' }

components:
  parameters:
    EventId:
      name: eventId
      in: path
      required: true
      description: Identifiant UUID de l'événement
      schema: { type: string, format: uuid }
    OrderId:
      name: orderId
      in: path
      required: true
      description: Identifiant UUID de la commande
      schema: { type: string, format: uuid }
    TicketId:
      name: ticketId
      in: path
      required: true
      description: Identifiant UUID du billet
      schema: { type: string, format: uuid }

  responses:
    BadRequest:
      description: Requête mal formée (JSON invalide ou syntaxe incorrecte)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: Ressource introuvable
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Conflict:
      description: Conflit avec l'état actuel de la ressource (événement complet, billet déjà scanné ou annulé)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Validation:
      description: Le corps ou les paramètres ne respectent pas les règles métier
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ValidationProblem' }

  headers:
    Location:
      description: URI de la ressource créée
      schema: { type: string }

  schemas:
    Problem:
      type: object
      description: Erreur au format RFC 9457
      required: [type, title, status]
      properties:
        type: { type: string, format: uri, example: 'https://api.orbitale.test/problems/not-found' }
        title: { type: string, example: Ressource introuvable }
        status: { type: integer, example: 404 }
        detail: { type: string, example: Événement introuvable }
        instance: { type: string, example: /v1/events/6f1c2b8e-4f3a-4e8b-9a51-2d7c0f9e1a23 }

    ValidationProblem:
      description: Erreur de validation au format RFC 9457
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required: [errors]
          properties:
            errors:
              type: array
              items:
                type: object
                required: [field, message]
                properties:
                  field: { type: string, example: capacity }
                  message: { type: string, example: Doit être supérieur ou égal à 1 }

    Event:
      type: object
      required: [id, title, venue, startsAt, capacity, remaining, price, currency, status, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        title: { type: string, minLength: 3, maxLength: 120 }
        description: { type: [string, 'null'], maxLength: 2000 }
        venue: { type: string, minLength: 2, maxLength: 120 }
        startsAt: { type: string, format: date-time }
        capacity: { type: integer, minimum: 1, maximum: 100000 }
        remaining: { type: integer, readOnly: true, description: Places encore disponibles }
        price: { type: integer, minimum: 0, description: Prix en centimes (3900 = 39,00 €) }
        currency: { type: string, enum: [EUR] }
        status: { type: string, enum: [draft, published, cancelled] }
        createdAt: { type: string, format: date-time, readOnly: true }
        updatedAt: { type: string, format: date-time, readOnly: true }

    EventCreate:
      type: object
      additionalProperties: false
      required: [title, venue, startsAt, capacity, price]
      properties:
        title: { type: string, minLength: 3, maxLength: 120 }
        description: { type: [string, 'null'], maxLength: 2000 }
        venue: { type: string, minLength: 2, maxLength: 120 }
        startsAt: { type: string, format: date-time }
        capacity: { type: integer, minimum: 1, maximum: 100000 }
        price: { type: integer, minimum: 0, description: Prix en centimes (3900 = 39,00 €) }
        status: { type: string, enum: [draft, published], default: draft }

    EventPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        title: { type: string, minLength: 3, maxLength: 120 }
        description: { type: [string, 'null'], maxLength: 2000 }
        venue: { type: string, minLength: 2, maxLength: 120 }
        startsAt: { type: string, format: date-time }
        capacity: { type: integer, minimum: 1, maximum: 100000 }
        price: { type: integer, minimum: 0, description: Prix en centimes (3900 = 39,00 €) }
        status: { type: string, enum: [draft, published, cancelled] }

    Ticket:
      type: object
      required: [id, orderId, eventId, code, status, usedAt]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        orderId: { type: string, format: uuid, readOnly: true }
        eventId: { type: string, format: uuid, readOnly: true }
        code: { type: string, pattern: '^ORB-[0-9A-F]{12}$', readOnly: true }
        status: { type: string, enum: [valid, used, cancelled] }
        usedAt: { type: [string, 'null'], format: date-time, readOnly: true }

    OrderCreate:
      type: object
      additionalProperties: false
      required: [eventId, quantity, buyerEmail]
      properties:
        eventId: { type: string, format: uuid }
        quantity: { type: integer, minimum: 1, maximum: 10 }
        buyerEmail: { type: string, format: email }

    OrderPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        status: { type: string, enum: [cancelled] }

    Order:
      type: object
      required: [id, eventId, buyerEmail, totalAmount, currency, status, tickets, createdAt]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        eventId: { type: string, format: uuid, readOnly: true }
        buyerEmail: { type: string, format: email }
        totalAmount: { type: integer, minimum: 0, readOnly: true, description: Montant total en centimes }
        currency: { type: string, enum: [EUR], readOnly: true }
        status: { type: string, enum: [confirmed, cancelled] }
        tickets:
          type: array
          readOnly: true
          items: { $ref: '#/components/schemas/Ticket' }
        createdAt: { type: string, format: date-time, readOnly: true }

    ScanCreate:
      type: object
      additionalProperties: false
      required: [ticketCode, gate]
      properties:
        ticketCode: { type: string, pattern: '^ORB-[0-9A-F]{12}$' }
        gate: { type: string, minLength: 1, maxLength: 50 }

    Scan:
      type: object
      required: [id, ticketId, ticketCode, gate, result, scannedAt]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        ticketId: { type: string, format: uuid, readOnly: true }
        ticketCode: { type: string, pattern: '^ORB-[0-9A-F]{12}$', readOnly: true }
        gate: { type: string, minLength: 1, maxLength: 50 }
        result: { type: string, enum: [valid, already_used, cancelled], readOnly: true }
        scannedAt: { type: string, format: date-time, readOnly: true }
